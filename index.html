<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio ER</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B7A75'/%3E%3Crect x='5' y='6' width='12' height='8' rx='1' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M17 18l5-4 5 4-5 4z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 14v8h6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header bar · tool rail | drawing stage | properties panel (drawer on phones) */
:root {
  --bg: #E9EDF1;
  --surface: #FFFFFF;
  --surface-2: #F3F5F8;
  --ink: #17202B;
  --muted: #5A6675;
  --line: #D3DAE2;
  --accent: #0B7A75;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFED;
  --warn: #A86108;
  --warn-soft: #FBEBD3;
  --danger: #B42318;
  --danger-soft: #FCE4E1;
  --ok: #1E7A3C;
  --grid: #CBD3DC;
  --shadow: 0 1px 2px rgba(23,32,43,.06), 0 8px 24px rgba(23,32,43,.08);
  --f-ui: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1217; --surface: #151B22; --surface-2: #1B232C; --ink: #E4E9EF; --muted: #93A0AE;
    --line: #29333E; --accent: #3CC0B6; --accent-ink: #062523; --accent-soft: #123331;
    --warn: #E3A447; --warn-soft: #33260F; --danger: #F07A6E; --danger-soft: #3A1A17; --ok: #5FCB85;
    --grid: #26303A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1217; --surface: #151B22; --surface-2: #1B232C; --ink: #E4E9EF; --muted: #93A0AE;
  --line: #29333E; --accent: #3CC0B6; --accent-ink: #062523; --accent-soft: #123331;
  --warn: #E3A447; --warn-soft: #33260F; --danger: #F07A6E; --danger-soft: #3A1A17; --ok: #5FCB85;
  --grid: #26303A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* Header */
.top {
  display: flex; align-items: center; gap: 12px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
.pname {
  min-width: 0; flex: 0 1 260px; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 5px 8px; font-weight: 500;
}
.pname:hover { border-color: var(--line); }
.pname:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }
.actions { display: flex; align-items: center; gap: 6px; margin-left: auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.actions::-webkit-scrollbar { display: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 11px; font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.icon { padding: 6px 8px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:disabled { opacity: .4; cursor: default; }
.sep { width: 1px; height: 22px; background: var(--line); flex: none; }
.nseg { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); flex: none; }
.nseg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-weight: 500; font-size: 13px; color: var(--muted); }
.nseg button:hover { color: var(--ink); }
.nseg button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.nseg-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.nt-batini { display: none; }
:root[data-notation="batini"] .nt-batini { display: revert; }
:root[data-notation="batini"] .nt-chen { display: none; }
.only-mobile { display: none; }

/* Main */
main { display: grid; grid-template-columns: 58px minmax(0,1fr) 330px; min-height: 0; }
.tools {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; overflow-y: auto;
}
.tool {
  position: relative; width: 42px; height: 42px; border-radius: 9px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; color: var(--muted); flex: none;
}
.tool svg { width: 24px; height: 24px; }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tool .k { position: absolute; right: 3px; bottom: 1px; font: 500 9px var(--f-mono); opacity: .7; }
.tools hr { width: 28px; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.stage { position: relative; overflow: hidden; min-width: 0; }
#svg {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
  background-image: radial-gradient(var(--grid) 1.1px, transparent 1.2px);
}
#svg.nogrid { background-image: none; }
.stage[data-tool="hand"] #svg, .stage.panning #svg { cursor: grab; }
.stage.panning.dragging #svg { cursor: grabbing; }
.stage[data-tool="entity"] #svg, .stage[data-tool="weak"] #svg, .stage[data-tool="relationship"] #svg,
.stage[data-tool="attribute"] #svg, .stage[data-tool="isa"] #svg, .stage[data-tool="note"] #svg { cursor: crosshair; }
.stage[data-tool="connect"] #svg { cursor: cell; }
#svg .node { cursor: move; }
.stage[data-tool="connect"] #svg .node { cursor: pointer; }
#svg text { user-select: none; -webkit-user-select: none; }
.edge-hit { cursor: pointer; }

.hint {
  position: absolute; left: 14px; top: 12px; max-width: calc(100% - 28px);
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; font-size: 12.5px; color: var(--muted); pointer-events: none; box-shadow: var(--shadow);
}
.hint b { color: var(--ink); font-weight: 600; }
.zoombar {
  position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: var(--shadow);
}
.zoombar button { border: 0; background: transparent; border-radius: 6px; padding: 5px 8px; display: grid; place-items: center; }
.zoombar button:hover { background: var(--surface-2); }
.zoombar button.on { color: var(--accent); }
.zoombar svg { width: 16px; height: 16px; }
#zoomLbl { font: 500 12px var(--f-mono); min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.drop {
  position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 80%, transparent);
  display: grid; place-items: center; font-weight: 600; color: var(--accent); font-size: 16px; pointer-events: none;
}
.inline-edit {
  position: absolute; z-index: 5; border: 2px solid var(--accent); border-radius: 6px; background: var(--surface);
  text-align: center; padding: 2px 6px; outline: none; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600;
}
textarea.inline-edit { text-align: left; font-weight: 400; resize: none; }

/* Side panel */
.side { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tab {
  border: 0; background: transparent; padding: 11px 10px 9px; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
}
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.badge { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.badge.zero { background: var(--accent-soft); color: var(--accent); }
.panel { overflow-y: auto; padding: 16px; flex: 1; min-height: 0; }
.panel h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; text-wrap: balance; }
.panel .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.eyebrow { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.inp {
  width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); padding: 7px 9px;
}
.inp:focus { outline: none; border-color: var(--accent); background: var(--surface); }
textarea.inp { min-height: 90px; resize: vertical; }
.checks { display: grid; gap: 2px; margin-bottom: 12px; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.check:hover { background: var(--surface-2); }
.check input { margin-top: 2px; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row .btn { font-size: 13px; padding: 5px 9px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font: 500 12px var(--f-mono); }
.chip:hover, .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.plist { display: grid; gap: 8px; }
.pitem { border: 1px solid var(--line); border-radius: 8px; padding: 9px; display: grid; gap: 6px; }
.pitem .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pitem .nm button { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 0; }
.linkbtn { border: 0; background: transparent; color: var(--accent); padding: 0; font-weight: 500; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.alist li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; }
.alist li:hover { background: var(--surface-2); }
.tag { font: 500 10.5px var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.pk { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 6px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.stat b { display: block; font: 600 18px var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }
.legend { display: grid; gap: 7px; }
.legend div { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 10px; font-size: 12.5px; }
.legend svg { width: 54px; height: 28px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); white-space: nowrap; }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issue { display: grid; grid-template-columns: 8px 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
.issue:hover { border-color: var(--accent); }
.issue i { width: 8px; border-radius: 3px; background: var(--warn); }
.issue.err i { background: var(--danger); }
.issue small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.okmsg { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.rel { font: 400 13px/1.7 var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.rel div { white-space: nowrap; }
.rel u { text-underline-offset: 3px; }
.rel em { font-style: italic; color: var(--accent); }
pre.sql { font: 400 12px/1.55 var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0; white-space: pre; }
.note-s { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
.mt { margin-top: 12px; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-weight: 500; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50; max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--danger); color: #fff; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(10,15,20,.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(440px, 100%); padding: 20px; box-shadow: var(--shadow); max-height: 100%; overflow-y: auto; }
.dialog h2 { margin: 0 0 4px; font-size: 17px; }
.dialog p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); }
.seg label { flex: 1; text-align: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.preview { margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 8px; height: 150px; display: grid; place-items: center; overflow: hidden;
  background-image: linear-gradient(45deg, var(--surface-2) 25%, transparent 25%, transparent 75%, var(--surface-2) 75%), linear-gradient(45deg, var(--surface-2) 25%, transparent 25%, transparent 75%, var(--surface-2) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.preview img { max-width: 100%; max-height: 100%; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.dim { color: var(--muted); font: 400 12px var(--f-mono); }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
  .tools { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); order: 2; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); overflow-x: auto; justify-content: flex-start; }
  .tools hr { width: 1px; height: 28px; border-top: 0; border-left: 1px solid var(--line); margin: 0 4px; }
  .stage { order: 1; }
  .side { position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 30; box-shadow: var(--shadow); transform: translateX(105%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; }
  .only-mobile { display: inline-flex; }
  .hide-sm { display: none; }
  .brand span { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="7" width="8" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17 5.5 22.5 12 17 18.5 11.5 12Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/><path d="M9.5 12h2" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Studio ER</span>
    </div>
    <input id="projName" class="pname" aria-label="Nome del progetto" spellcheck="false">
    <div class="actions">
      <span class="nseg-label hide-sm">Notazione</span>
      <div class="nseg hide-sm" role="group" aria-label="Notazione del diagramma">
        <button data-nbtn="batini" title="Notazione Batini (Atzeni et al.)">Batini</button>
        <button data-nbtn="chen" title="Notazione Chen">Chen</button>
      </div>
      <span class="sep hide-sm"></span>
      <button class="btn" id="btnNew" title="Nuovo progetto vuoto">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5l3.5 3.5v9.5h-8.5z"/><path d="M9 1.5V5h3.5"/></svg><span class="hide-sm">Nuovo</span></button>
      <button class="btn" id="btnOpen" title="Apri un progetto .json (Ctrl+O)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13z"/></svg><span class="hide-sm">Apri</span></button>
      <button class="btn" id="btnSave" title="Scarica il progetto come .json (Ctrl+S)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5v9M4.5 7 8 10.5 11.5 7M2 12v2.5h12V12"/></svg><span class="hide-sm">Salva progetto</span></button>
      <button class="btn primary" id="btnExport" title="Esporta PNG o SVG (Ctrl+E)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="m1.5 11 4-4 3.5 3.5 2-2 3.5 3.5"/><circle cx="11" cy="5.5" r="1.2"/></svg><span>Esporta PNG</span></button>
      <span class="sep"></span>
      <button class="btn icon" id="btnUndo" title="Annulla (Ctrl+Z)" aria-label="Annulla">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="btn icon" id="btnRedo" title="Ripeti (Ctrl+Shift+Z)" aria-label="Ripeti">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H10"/></svg></button>
      <button class="btn icon" id="btnTheme" title="Tema" aria-label="Cambia tema">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></svg></button>
      <button class="btn only-mobile" id="btnPanel">Pannello</button>
    </div>
  </header>

  <main>
    <nav class="tools" id="tools" aria-label="Strumenti">
      <button class="tool" data-tool="select" title="Seleziona e sposta (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5 18 12l-5.2 1.2L10 19z" stroke-linejoin="round"/></svg><span class="k">V</span></button>

      <hr>

<script>
(() => {
'use strict';

/* ---------- Costanti e stato ---------- */
const DFONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const GRID = 20;
const STORE_KEY = 'studio-er:v1';
const THEME_KEY = 'studio-er:theme';
const NOTATION_KEY = 'studio-er:notation';
const TYPES = ['entity', 'relationship', 'attribute', 'isa', 'note'];
const TYPE_NAME = { entity: 'Entità', relationship: 'Relazione', attribute: 'Attributo', isa: 'Generalizzazione', note: 'Nota' };
const DTYPES = ['VARCHAR(100)', 'VARCHAR(255)', 'CHAR(16)', 'INT', 'BIGINT', 'DECIMAL(10,2)', 'DATE', 'DATETIME', 'BOOLEAN', 'TEXT'];
const CARDS = ['(0,1)', '(1,1)', '(0,N)', '(1,N)', '1', 'N', 'M'];

const PAL = {
  light: { bg: '#FFFFFF', text: '#17202B', stroke: '#17202B', edge: '#3B4654', entity: '#E3F1EF', rel: '#FBEFD8', attr: '#FFFFFF', isa: '#ECE8F7', note: '#FFF6BF', noteStroke: '#D2BE5A', sel: '#0B7A75', card: '#0A5F5B', muted: '#5A6675' },
  dark:  { bg: '#10161C', text: '#E4E9EF', stroke: '#C9D2DC', edge: '#93A0AE', entity: '#16302E', rel: '#3A2D14', attr: '#1A222B', isa: '#28233E', note: '#3A3517', noteStroke: '#8C7F3A', sel: '#3CC0B6', card: '#72D9D0', muted: '#93A0AE' }
};

let doc = emptyDoc();
let view = { x: 0, y: 0, k: 1 };
let sel = new Set();
let tool = 'select';
let snap = true;
let undoStack = [], redoStack = [];
let clipboard = null;
let tab = 'props';
let seq = 1;
let pendingConnect = null; // id del nodo di partenza
let spaceDown = false;
let gesture = null;
let notation = 'batini'; // 'batini' | 'chen'
let idMarks = { filled: new Set(), svg: '' };
const isB = () => notation === 'batini';

const $ = s => document.querySelector(s);
const svg = $('#svg'), vp = $('#vp'), gEdges = $('#edges'), gNodes = $('#nodes'), gOver = $('#overlay');
const stage = $('#stage'), panel = $('#panel');

function emptyDoc(name = 'Nuovo progetto') { return { app: 'studio-er', version: 1, name, nodes: [], edges: [] }; }
const uid = p => p + Date.now().toString(36).slice(-5) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => doc.nodes.find(n => n.id === id);
const edgeById = id => doc.edges.find(e => e.id === id);
const r1 = v => Math.round(v * 10) / 10;

/* ---------- Misure ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function tw(text, weight = 600, size = 14) { mctx.font = `${weight} ${size}px ${DFONT}`; return mctx.measureText(text || '').width; }
// Batini: un attributo con sotto-attributi è composto (ovale), gli altri sono "lecca-lecca"
function isComposite(n) {
  if (n.type !== 'attribute') return false;
  const links = nb(n.id);
  const subs = links.filter(x => x.o.type === 'attribute').length;
  return subs >= 2 || (subs >= 1 && links.some(x => x.o.type === 'entity' || x.o.type === 'relationship'));
}
const isLolli = n => isB() && n.type === 'attribute' && !isComposite(n);
function attrText(n) {
  if (!isB()) return n.label;
  if (n.multi) return n.label + (n.optional ? ' (0,N)' : ' (1,N)');
  return n.optional ? n.label + ' (0,1)' : n.label;
}
function lolli(n) {
  const own = nb(n.id).map(x => x.o).find(o => o.type !== 'note');
  const dx = own ? n.x - own.x : 0, dy = own ? n.y - own.y : -1;
  const txt = attrText(n), w = tw(txt, 400, 13);
  let anchor, tx, ty;
  if (Math.abs(dx) >= Math.abs(dy) * 0.7) { anchor = dx >= 0 ? 'start' : 'end'; tx = n.x + (dx >= 0 ? 11 : -11); ty = n.y; }
  else { anchor = 'middle'; tx = n.x; ty = n.y + (dy < 0 ? -16 : 16); }
  const x1 = anchor === 'start' ? tx : anchor === 'end' ? tx - w : tx - w / 2;
  return { txt, anchor, tx, ty, x1, x2: x1 + w, y1: ty - 9, y2: ty + 9 };
}
function extent(n) {
  const { w, h } = size(n);
  let x1 = n.x - w / 2, y1 = n.y - h / 2, x2 = n.x + w / 2, y2 = n.y + h / 2;
  if (n.type === 'isa') { x2 += 40; y1 -= 18; }
  if (isLolli(n)) { const L = lolli(n); x1 = Math.min(x1, L.x1); x2 = Math.max(x2, L.x2); y1 = Math.min(y1, L.y1); y2 = Math.max(y2, L.y2); }
  return { x1, y1, x2, y2 };
}
function size(n) {
  if (isB()) {
    if (n.type === 'entity') return { w: Math.max(110, tw(n.label) + 42), h: 50 };
    if (n.type === 'relationship') return { w: Math.max(124, (tw(n.label) + 26) / 0.66), h: 66 };
    if (n.type === 'isa' || isLolli(n)) return { w: 14, h: 14 };
    if (n.type === 'attribute') return { w: Math.max(78, tw(attrText(n), 400) + 38), h: 38 };
  }
  switch (n.type) {
    case 'entity': return { w: Math.max(110, tw(n.label) + 42 + (n.weak ? 10 : 0)), h: n.weak ? 56 : 50 };
    case 'relationship': return { w: Math.max(124, (tw(n.label) + 26) / 0.66 + (n.identifying ? 14 : 0)), h: n.identifying ? 74 : 66 };
    case 'attribute': return { w: Math.max(78, tw(n.label, 400) + 38 + (n.multi ? 8 : 0)), h: n.multi ? 44 : 38 };
    case 'isa': return { w: 86, h: 60 };
    case 'note': {
      const lines = String(n.label || '').split('\n');
      return { w: Math.max(150, ...lines.map(l => tw(l, 400, 13) + 30)), h: lines.length * 18 + 24 };
    }
  }
  return { w: 100, h: 50 };
}
function inside(n, x, y, pad = 1, sz) {
  const { w, h } = sz || size(n); const dx = Math.abs(x - n.x), dy = Math.abs(y - n.y);
  if (n.type === 'attribute') return (dx / (w / 2)) ** 2 + (dy / (h / 2)) ** 2 <= pad;
  if (n.type === 'relationship') return dx / (w / 2) + dy / (h / 2) <= pad;
  return dx <= w / 2 * pad && dy <= h / 2 * pad;
}

/* ---------- Rendering diagramma ---------- */
function diagramCSS(p) {
  return `
.node text{font:600 14px ${DFONT};fill:${p.text};dominant-baseline:central;text-anchor:middle}
.n-attribute text{font-weight:400}
.n-note text{font:400 13px ${DFONT};text-anchor:start;dominant-baseline:auto}
.n-isa text{font-size:12px;letter-spacing:.06em}
.shape{stroke:${p.stroke};stroke-width:1.6}
.n-entity .shape{fill:${p.entity}}.n-relationship .shape{fill:${p.rel}}.n-attribute .shape{fill:${p.attr}}.n-isa .shape{fill:${p.isa}}
.n-note .shape{fill:${p.note};stroke:${p.noteStroke}}.n-note .fold{fill:none;stroke:${p.noteStroke};stroke-width:1.3}
.inner{fill:none;stroke:${p.stroke};stroke-width:1.3}
.dashed{stroke-dasharray:5 4}
.uline{stroke:${p.text};stroke-width:1.3}.uline.dashed{stroke-dasharray:3 3}
.edge{fill:none;stroke:${p.edge};stroke-width:1.6}
.edge.total{stroke-width:5.4}
.edge-inner{fill:none;stroke:${p.bg};stroke-width:1.8}
.edge.note-link{stroke-dasharray:4 4;stroke-width:1.2}
.card{font:600 12.5px ${DFONT};fill:${p.card};text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:${p.bg};stroke-width:4px;stroke-linejoin:round}
.role{font:italic 400 12px ${DFONT};fill:${p.muted};text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:${p.bg};stroke-width:4px}
.isa-tag{font:500 11.5px ${DFONT};fill:${p.muted}}
.sel .shape{stroke:${p.sel};stroke-width:2.6}
.edge.sel{stroke:${p.sel}}
.edge-hit{fill:none;stroke:transparent;stroke-width:14}
.node.target .shape{stroke:${p.sel};stroke-width:3}
.lbl{font-size:13px;font-weight:400}
.n-attribute .shape.filled,.junction{fill:${p.stroke}}
.hit{fill:transparent;stroke:none}
.edge.dash{stroke-dasharray:5 4}
.idbar{fill:none;stroke:${p.stroke};stroke-width:1.6;stroke-linecap:round}
.iddot{fill:${p.stroke}}
.arrow{fill:${p.bg};stroke:${p.edge};stroke-width:1.6;stroke-linejoin:round}
.arrow.filled{fill:${p.edge}}
.arrow.sel{stroke:${p.sel}}.arrow.filled.sel{fill:${p.sel}}
.tmp-line{stroke:${p.sel};stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.box{fill:${p.sel};fill-opacity:.08;stroke:${p.sel};stroke-dasharray:4 3}`;
}

function nodeSVG(n, selected) {
  const { w, h } = size(n); const x = n.x, y = n.y, hw = w / 2, hh = h / 2;
  let s = '';
  const L = esc(n.label);
  if (isB() && n.type !== 'note') {
    if (isLolli(n)) {
      const P = lolli(n), filled = idMarks.filled.has(n.id);
      const hx = Math.min(P.x1, x - 8), hx2 = Math.max(P.x2, x + 8), hy = Math.min(P.y1, y - 8), hy2 = Math.max(P.y2, y + 8);
      s += `<rect class="hit" x="${r1(hx - 3)}" y="${r1(hy - 3)}" width="${r1(hx2 - hx + 6)}" height="${r1(hy2 - hy + 6)}"/>`;
      s += `<circle class="shape${n.derived ? ' dashed' : ''}${filled ? ' filled' : ''}" cx="${r1(x)}" cy="${r1(y)}" r="5"/>`;
      s += `<text class="lbl" x="${r1(P.tx)}" y="${r1(P.ty)}" style="text-anchor:${P.anchor}">${esc(P.txt)}</text>`;
      return `<g class="node n-attribute${selected ? ' sel' : ''}" data-node="${n.id}">${s}</g>`;
    }
    if (n.type === 'attribute') {
      s += `<ellipse class="shape${n.derived ? ' dashed' : ''}" cx="${r1(x)}" cy="${r1(y)}" rx="${r1(hw)}" ry="${hh}"/><text x="${r1(x)}" y="${r1(y)}">${esc(attrText(n))}</text>`;
      return `<g class="node n-attribute${selected ? ' sel' : ''}" data-node="${n.id}">${s}</g>`;
    }
    if (n.type === 'isa') {
      s += `<circle class="hit" cx="${r1(x)}" cy="${r1(y)}" r="12"/><circle class="shape junction" cx="${r1(x)}" cy="${r1(y)}" r="3.5"/>`;
      if (isaInfo(n).children.length >= 2) s += `<text class="isa-tag" x="${r1(x + 10)}" y="${r1(y - 12)}" style="text-anchor:start">(${n.total ? 't' : 'p'},${n.disjoint ? 'e' : 's'})</text>`;
      return `<g class="node n-isa${selected ? ' sel' : ''}" data-node="${n.id}">${s}</g>`;
    }
    if (n.type === 'entity') {
      s += `<rect class="shape" x="${r1(x - hw)}" y="${r1(y - hh)}" width="${r1(w)}" height="${h}" rx="2"/><text x="${r1(x)}" y="${r1(y)}">${L}</text>`;
    } else if (n.type === 'relationship') {
      s += `<polygon class="shape" points="${r1(x)},${r1(y - hh)} ${r1(x + hw)},${r1(y)} ${r1(x)},${r1(y + hh)} ${r1(x - hw)},${r1(y)}"/><text x="${r1(x)}" y="${r1(y)}">${L}</text>`;
    }
    return `<g class="node n-${n.type}${selected ? ' sel' : ''}" data-node="${n.id}">${s}</g>`;
  }
  switch (n.type) {
    case 'entity':
      s += `<rect class="shape" x="${r1(x - hw)}" y="${r1(y - hh)}" width="${r1(w)}" height="${h}" rx="2"/>`;
      if (n.weak) s += `<rect class="inner" x="${r1(x - hw + 5)}" y="${r1(y - hh + 5)}" width="${r1(w - 10)}" height="${h - 10}" rx="1"/>`;
      s += `<text x="${r1(x)}" y="${r1(y)}">${L}</text>`;
      break;
    case 'relationship': {
      s += `<polygon class="shape" points="${r1(x)},${r1(y - hh)} ${r1(x + hw)},${r1(y)} ${r1(x)},${r1(y + hh)} ${r1(x - hw)},${r1(y)}"/>`;
      if (n.identifying) { const iw = hw - 11, ih = hh - 7; s += `<polygon class="inner" points="${r1(x)},${r1(y - ih)} ${r1(x + iw)},${r1(y)} ${r1(x)},${r1(y + ih)} ${r1(x - iw)},${r1(y)}"/>`; }
      s += `<text x="${r1(x)}" y="${r1(y)}">${L}</text>`;
      break;
    }
    case 'attribute': {
      s += `<ellipse class="shape${n.derived ? ' dashed' : ''}" cx="${r1(x)}" cy="${r1(y)}" rx="${r1(hw)}" ry="${hh}"/>`;
      if (n.multi) s += `<ellipse class="inner" cx="${r1(x)}" cy="${r1(y)}" rx="${r1(hw - 5)}" ry="${hh - 5}"/>`;
      s += `<text x="${r1(x)}" y="${r1(y)}">${L}</text>`;
      if (n.key || n.partial) { const t = tw(n.label, 400) / 2; s += `<line class="uline${n.partial && !n.key ? ' dashed' : ''}" x1="${r1(x - t)}" x2="${r1(x + t)}" y1="${r1(y + 9)}" y2="${r1(y + 9)}"/>`; }
      break;
    }
    case 'isa': {
      s += `<polygon class="shape" points="${r1(x)},${r1(y - hh)} ${r1(x + hw)},${r1(y + hh)} ${r1(x - hw)},${r1(y + hh)}"/>`;
      s += `<text x="${r1(x)}" y="${r1(y + 10)}">${L}</text>`;
      s += `<text class="isa-tag" x="${r1(x + hw * 0.62)}" y="${r1(y - hh * 0.35)}" style="text-anchor:start">(${n.total ? 't' : 'p'},${n.disjoint ? 'e' : 's'})</text>`;
      break;
    }
    case 'note': {
      const f = 12;
      s += `<path class="shape" d="M${r1(x - hw)},${r1(y - hh)}H${r1(x + hw)}V${r1(y + hh - f)}L${r1(x + hw - f)},${r1(y + hh)}H${r1(x - hw)}Z"/>`;
      s += `<path class="fold" d="M${r1(x + hw)},${r1(y + hh - f)}H${r1(x + hw - f)}V${r1(y + hh)}"/>`;
      const lines = String(n.label || '').split('\n');
      s += `<text x="${r1(x - hw + 14)}" y="${r1(y - hh + 12)}">` + lines.map((l, i) => `<tspan x="${r1(x - hw + 14)}" dy="${i ? 18 : 14}">${esc(l) || ' '}</tspan>`).join('') + `</text>`;
      break;
    }
  }
  return `<g class="node n-${n.type}${selected ? ' sel' : ''}" data-node="${n.id}">${s}</g>`;
}

function pairGroups() {
  const g = {};
  for (const e of doc.edges) { const k = [e.from, e.to].sort().join('|'); (g[k] = g[k] || []).push(e); }
  return g;
}
function edgeGeo(e, groups) {
  const a = byId(e.from), b = byId(e.to); if (!a || !b) return null;
  const pair = [e.from, e.to].sort(); const P = byId(pair[0]), Q = byId(pair[1]);

}
let saveTimer = 0;

}

/* ---------- Puntatore ---------- */

    gNodes.querySelectorAll('.target').forEach(el => el.classList.remove('target'));

    const fkCols = new Set(t.fks.flatMap(f => f.cols));
    const cols = t.cols.map(c => { let s = esc(c.name); if (fkCols.has(c.name)) s = `<em>${s}</em>`; if (t.pk.includes(c.name)) s = `<u>${s}</u>`; return s; });
    return `<div><b>${esc(t.name)}</b>(${cols.join(', ')})</div>`;
  }).join('');
}
function sqlOf(tables) {
  const order = []; const left = [...tables]; const done = new Set();
  while (left.length) {
    const i = left.findIndex(t => t.fks.every(f => f.ref === t.name || done.has(f.ref) || !tables.some(x => x.name === f.ref)));
    const t = left.splice(i < 0 ? 0 : i, 1)[0]; order.push(t); done.add(t.name);
  }
  return `-- Generato da Studio ER · ${doc.name}\n\n` + order.map(t => {
    const lines = t.cols.map(c => `  ${c.name} ${c.type}${c.nullable && !t.pk.includes(c.name) ? '' : ' NOT NULL'}`);
    if (t.pk.length) lines.push(`  PRIMARY KEY (${t.pk.join(', ')})`);
    t.fks.forEach(f => lines.push(`  FOREIGN KEY (${f.cols.join(', ')}) REFERENCES ${f.ref} (${f.refCols.join(', ')})`));
    return `CREATE TABLE ${t.name} (\n${lines.join(',\n')}\n);`;
  }).join('\n\n') + '\n';
}

  else renderPanel();
});
panel.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'select': sel = new Set([id]); if (tab !== 'props') setTab('props'); commit(); centerOn(id); break;
    case 'card': { const e = edgeById(id); if (e) { checkpoint(); e.card = e.card === b.dataset.val ? '' : b.dataset.val; commit(); } break; }
    case 'addattr': addAttributeTo(id); break;
    case 'addkey': addAttributeTo(id, { key: true }); break;
    case 'delete': deleteSel(); break;
    case 'dup': copySel(); paste(); break;
    case 'alignh': case 'alignv': {
      checkpoint(); const ns = [...sel].map(byId).filter(Boolean);
      const k = b.dataset.act === 'alignh' ? 'y' : 'x'; const avg = snapV(ns.reduce((s, n) => s + n[k], 0) / ns.length);
      ns.forEach(n => n[k] = avg); commit(); break;
    }
    case 'distrib': {
      const ns = [...sel].map(byId).filter(Boolean); if (ns.length < 3) { toast('Seleziona almeno tre forme'); break; }
      checkpoint(); const b2 = bbox(ns); const k = b2.w >= b2.h ? 'x' : 'y'; ns.sort((a, c) => a[k] - c[k]);
      const first = ns[0][k], last = ns[ns.length - 1][k]; ns.forEach((n, i) => n[k] = first + (last - first) * i / (ns.length - 1)); commit(); break;
    }
    case 'example': loadExample(true); break;
    case 'copysql': copyText(lastSQL, 'SQL copiato'); break;
    case 'copymd': copyText(lastMD, 'Markdown copiato'); break;
    case 'copyrel': copyText(lastRel, 'Schema copiato'); break;
    case 'savesql': saveFile(fileBase() + '.txt', lastSQL, 'text/plain'); break;
  }
});
function centerOn(id) {
  const n = byId(id) || (edgeById(id) && byId(edgeById(id).from)); if (!n) return;
  const r = svg.getBoundingClientRect(); const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
  if (sx < 40 || sy < 40 || sx > r.width - 40 || sy > r.height - 40) { view.x = r.width / 2 - n.x * view.k; view.y = r.height / 2 - n.y * view.k; applyView(); }
}
function copyText(text, msg) {
  const fallback = () => { const pre = $('#sqlOut'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Copia non disponibile: testo selezionato, premi Ctrl+C', true); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch (e) { fallback(); }
}

/* ---------- File: salva, apri, esporta ---------- */
const downloadsP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
const fileBase = () => (doc.name || 'diagramma').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-').toLowerCase() || 'diagramma';
async function saveFile(filename, data, mime) {
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename, data }); toast('File salvato: ' + filename); }
    catch (err) { if (err?.code === 'declined') toast('Salvataggio annullato'); else if (err?.code === 'rate_limited') toast('Attendi un momento e riprova', true); else toast('Non è stato possibile salvare il file qui', true); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('File scaricato: ' + filename);
}
function saveProject() {
  const out = { ...doc, savedAt: new Date().toISOString() };
  saveFile(fileBase() + '.json', JSON.stringify(out, null, 2), 'application/json');
}
function sanitize(d) {
  if (!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error('Il file non contiene un progetto Studio ER (mancano nodes ed edges).');
  const nodes = d.nodes.filter(n => n && TYPES.includes(n.type) && isFinite(n.x) && isFinite(n.y)).map(n => ({ ...DEFAULTS[n.type](), ...n, id: String(n.id), label: String(n.label ?? ''), x: +n.x, y: +n.y }));
  const ids = new Set(nodes.map(n => n.id));
  const edges = d.edges.filter(e => e && ids.has(String(e.from)) && ids.has(String(e.to))).map(e => ({ id: String(e.id || uid('e')), from: String(e.from), to: String(e.to), card: String(e.card ?? ''), total: !!e.total, role: String(e.role ?? '') }));
  return { app: 'studio-er', version: 1, name: String(d.name || 'Progetto importato'), nodes, edges };
}
function importText(text, fname) {
  let d; try { d = sanitize(JSON.parse(text)); } catch (e) { toast(e instanceof SyntaxError ? 'Il file non è un JSON valido.' : e.message, true); return; }
  checkpoint(); doc = d; sel.clear(); afterLoad(); requestAnimationFrame(fit);
  toast(`Aperto “${doc.name}” · Ctrl+Z per tornare indietro`);
}
$('#fileInput').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(r.result, f.name); r.readAsText(f); ev.target.value = '';
});
let dragDepth = 0;
stage.addEventListener('dragenter', ev => { if ([...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); dragDepth++; $('#drop').hidden = false; } });
stage.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('drop', ev => {
  ev.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  const f = ev.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(r.result, f.name); r.readAsText(f);
});

function exportSVG(bgMode) {
  const pal = bgMode === 'dark' ? PAL.dark : PAL.light;
  const b = bbox(); if (!b) return null;
  const pad = 36; const x = Math.floor(b.x1 - pad), y = Math.floor(b.y1 - pad), w = Math.ceil(b.w + pad * 2), h = Math.ceil(b.h + pad * 2);
  const groups = pairGroups();
  idMarks = identifierMarks();
  const css = diagramCSS(bgMode === 'none' ? { ...pal, bg: '#FFFFFF' } : pal);
  return { w, h, text: `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><style>${css}</style>${bgMode !== 'none' ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${pal.bg}"/>` : ''}<g>${doc.edges.map(e => edgeSVG(e, groups, false, true)).join('')}${idMarks.svg}</g><g>${doc.nodes.map(n => nodeSVG(n, false)).join('')}</g></svg>` };
}
function svgToPng(s, scale) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(s.w * scale); c.height = Math.round(s.h * scale);
      const ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, s.w, s.h);
      c.toBlob(b => b ? res(b) : rej(new Error('PNG non generato')), 'image/png');
    };
    img.onerror = () => rej(new Error('Rendering non riuscito'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.text);
  });
}
const expVal = name => document.querySelector(`#exportModal input[name="${name}"]:checked`).value;
function updateExportPreview() {
  const s = exportSVG(expVal('bg')); const fmt = expVal('fmt'); const sc = +expVal('scale');
  $('#scaleField').hidden = fmt !== 'png';
  if (!s) return;
  $('#expPreview').innerHTML = `<img alt="Anteprima" src="${'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.text)}">`;
  $('#expInfo').textContent = fmt === 'png' ? `${Math.round(s.w * sc)} × ${Math.round(s.h * sc)} px` : `${s.w} × ${s.h} · vettoriale`;
}
function openExport() {
  if (!doc.nodes.length) { toast('Il diagramma è vuoto: aggiungi almeno un elemento', true); return; }
  commitInlineEdit();
  $('#exportModal').hidden = false; updateExportPreview(); $('#expGo').focus();
}
function closeExport() { $('#exportModal').hidden = true; }
$('#exportModal').addEventListener('change', updateExportPreview);
$('#exportModal').addEventListener('click', ev => { if (ev.target.id === 'exportModal') closeExport(); });
$('#expCancel').addEventListener('click', closeExport);
$('#expGo').addEventListener('click', async () => {
  const s = exportSVG(expVal('bg')); if (!s) return;
  const fmt = expVal('fmt');
  closeExport();
  if (fmt === 'svg') { saveFile(fileBase() + '.svg', s.text, 'image/svg+xml'); return; }
  try { const blob = await svgToPng(s, +expVal('scale')); saveFile(fileBase() + '.png', blob, 'image/png'); }
  catch (e) { toast('Esportazione PNG non riuscita: ' + e.message, true); }
});

/* ---------- Esempio ---------- */
function loadExample(withUndo) {
  if (withUndo) checkpoint();
  const N = (id, type, label, x, y, extra = {}) => ({ id, type, x, y, ...DEFAULTS[type === 'entity' && extra.weak ? 'weak' : type](), label, ...extra });
  const E = (from, to, card = '', extra = {}) => ({ id: 'e_' + from + '_' + to, from, to, card, total: false, role: '', ...extra });
  doc = {
    app: 'studio-er', version: 1, name: 'Esempio · Scuola',
    nodes: [
      N('stu', 'entity', 'Studente', 220, 320),
      N('a_mat', 'attribute', 'Matricola', 100, 200, { key: true, dtype: 'CHAR(6)' }),
      N('a_nom', 'attribute', 'Nome', 220, 180),
      N('a_cog', 'attribute', 'Cognome', 340, 200),
      N('a_nas', 'attribute', 'DataNascita', 100, 440, { dtype: 'DATE' }),
      N('a_eta', 'attribute', 'Età', 240, 460, { derived: true, dtype: 'INT' }),
      N('isc', 'relationship', 'Iscrizione', 500, 320),
      N('a_voto', 'attribute', 'Voto', 500, 200, { dtype: 'INT', optional: true }),
      N('cor', 'entity', 'Corso', 780, 320),
      N('a_cod', 'attribute', 'CodCorso', 700, 200, { key: true, dtype: 'CHAR(5)' }),
      N('a_tit', 'attribute', 'Titolo', 860, 200),
      N('a_cre', 'attribute', 'Crediti', 960, 260, { dtype: 'INT' }),
      N('ins', 'relationship', 'Insegna', 780, 520),
      N('doc', 'entity', 'Docente', 780, 700),
      N('a_cf', 'attribute', 'CodFiscale', 640, 800, { key: true, dtype: 'CHAR(16)' }),
      N('a_dn', 'attribute', 'NomeDocente', 800, 820),
      N('a_tel', 'attribute', 'Telefono', 960, 780, { multi: true, dtype: 'VARCHAR(20)' }),
      N('pre', 'relationship', 'Prevede', 1060, 420, { identifying: true }),
      N('lez', 'entity', 'Lezione', 1300, 420, { weak: true }),
      N('a_dat', 'attribute', 'Data', 1300, 300, { partial: true, dtype: 'DATE' }),
      N('a_aula', 'attribute', 'Aula', 1420, 520, { dtype: 'VARCHAR(10)' }),
      N('note1', 'note', 'Esempio: modifica, elimina o premi\n“Nuovo” per iniziare da zero.', 300, 640)
    ],
    edges: [
      E('stu', 'a_mat'), E('stu', 'a_nom'), E('stu', 'a_cog'), E('stu', 'a_nas'), E('stu', 'a_eta'),
      E('stu', 'isc', '(0,N)'), E('isc', 'cor', '(0,N)'), E('isc', 'a_voto'),
      E('cor', 'a_cod'), E('cor', 'a_tit'), E('cor', 'a_cre'),
      E('cor', 'ins', '(1,1)', { total: true }), E('ins', 'doc', '(0,N)'),
      E('doc', 'a_cf'), E('doc', 'a_dn'), E('doc', 'a_tel'),
      E('cor', 'pre', '(0,N)'), E('pre', 'lez', '(1,1)', { total: true }),
      E('lez', 'a_dat'), E('lez', 'a_aula')
    ]
  };
  sel.clear(); afterLoad(); requestAnimationFrame(fit);
  if (withUndo) toast('Esempio caricato · Ctrl+Z per tornare indietro');
}

/* ---------- Header ---------- */
$('#projName').addEventListener('input', ev => { doc.name = ev.target.value; persist(); });
$('#projName').addEventListener('change', ev => { if (!ev.target.value.trim()) { doc.name = 'Senza titolo'; ev.target.value = doc.name; } renderPanel(); persist(); });
$('#projName').addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.target.blur(); });
$('#btnNew').addEventListener('click', () => { checkpoint(); doc = emptyDoc(); sel.clear(); afterLoad(); const r = svg.getBoundingClientRect(); view = { x: r.width / 2, y: r.height / 2, k: 1 }; applyView(); toast('Nuovo progetto · Ctrl+Z per recuperare il precedente'); });
$('#btnOpen').addEventListener('click', () => $('#fileInput').click());
$('#btnSave').addEventListener('click', saveProject);
$('#btnExport').addEventListener('click', openExport);
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#btnPanel').addEventListener('click', () => $('#side').classList.toggle('open'));
$('#zIn').addEventListener('click', () => zoomCenter(1.2));
$('#zOut').addEventListener('click', () => zoomCenter(1 / 1.2));
$('#zoomLbl').addEventListener('click', () => zoomCenter(1 / view.k));
$('#zFit').addEventListener('click', fit);
$('#zGrid').addEventListener('click', () => { snap = !snap; $('#zGrid').classList.toggle('on', snap); svg.classList.toggle('nogrid', !snap); toast(snap ? 'Griglia e aggancio attivi' : 'Griglia disattivata'); persist(); });
document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function setMoveAttrs(on) {
  moveAttrs = on;
  const b = $('#optMoveAttrs'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  try { localStorage.setItem(MOVEATTRS_KEY, on ? '1' : '0'); } catch (e) {}
}
$('#optMoveAttrs').addEventListener('click', () => { setMoveAttrs(!moveAttrs); toast(moveAttrs ? 'Gli attributi seguono l\'entità' : 'Gli attributi restano fermi'); });
try { setMoveAttrs(localStorage.getItem(MOVEATTRS_KEY) === '1'); } catch (e) { setMoveAttrs(false); }

function setNotation(nt, quiet) {
  notation = nt === 'chen' ? 'chen' : 'batini';
  document.documentElement.setAttribute('data-notation', notation);
  try { localStorage.setItem(NOTATION_KEY, notation); } catch (e) {}
  document.querySelectorAll('[data-nbtn]').forEach(b => b.classList.toggle('on', b.dataset.nbtn === notation));
  if (quiet) return;
  renderCanvas(); renderPanel();
  toast(isB() ? 'Notazione Batini' : 'Notazione Chen');
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-nbtn]'); if (b && b.dataset.nbtn !== notation) setNotation(b.dataset.nbtn); });

const THEMES = ['system', 'light', 'dark'];
function setTheme(t, quiet) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  applyTheme(); renderCanvas();
  if (!quiet) toast({ system: 'Tema: come il sistema', light: 'Tema chiaro', dark: 'Tema scuro' }[t]);
}
$('#btnTheme').addEventListener('click', () => {
  let cur = 'system'; try { cur = localStorage.getItem(THEME_KEY) || 'system'; } catch (e) {}
  setTheme(THEMES[(THEMES.indexOf(cur) + 1) % 3]);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); });

/* ---------- Avvio ---------- */
function boot() {
  try { const t = localStorage.getItem(THEME_KEY); if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  applyTheme();
  let nt = 'batini'; try { nt = localStorage.getItem(NOTATION_KEY) || 'batini'; } catch (e) {}
  setNotation(nt, true);
  setTool('select');
  let saved = null; try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  if (saved && saved.doc) {
    try { doc = sanitize(saved.doc); } catch (e) { doc = emptyDoc(); }
    if (saved.view && isFinite(saved.view.k)) view = saved.view;
    if (saved.snap === false) { snap = false; $('#zGrid').classList.remove('on'); svg.classList.add('nogrid'); }
    $('#projName').value = doc.name; commit();
    if (!saved.view) requestAnimationFrame(fit);
  } else {
    loadExample(false);
  }
  if (document.fonts?.ready) document.fonts.ready.then(() => renderCanvas());
}
boot();
})();
</script>
